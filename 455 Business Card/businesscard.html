<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Business Card Container -->
    <div class="business-card">

        <!-- Front Side -->
        <div class="card-side front">
            <img src="me.jpg" alt="Profile Image" class="profile-image">
            <h1 class="name">Alex Cao</h1>
            <h2 class="title">Student</h2>
        </div>

        <!-- Back Side -->
        <div class="card-side back">
            <p class="bio">Computer Scientist & Video Game Enthusiast</p>
            <p class="contact">Email: acao4@toromail.csudh.edu</p>
            <p class="contact">Phone: (310) 895-6899</p>
        </div>
    </div>

</body>

</html>
