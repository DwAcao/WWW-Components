<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Business Card</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <section class="business-card-container">
        <div class="business-card">
            <div class="card-front">
                <img src="/images/Me.jpg" alt="Alex's Profile" class="profile-image">
                <h2 class="ibm-plex-serif-bold">Alex C.</h2>
                <p class="ibm-plex-serif-medium">Tech Enthusiast & Student</p>
            </div>

            <!-- Back Side -->
            <div class="card-back">
                <h3 class="ibm-plex-serif-semibold">Let's Connect!</h3>
                <p class="ibm-plex-serif-regular">Passionate about gaming, tech, and nature.</p>
                <div class="contact-info">
                    <p class="ibm-plex-serif-light">📧 acao4@toromail.csudh.edu</p>
                    <p class="ibm-plex-serif-light">📱 +1 (231) 123-4567</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
